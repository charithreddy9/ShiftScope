name: Experiment checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  reproducibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Re-run research study
        run: python -m shiftscope --seeds 7,21,42 --output ci-results
      - name: Verify reports and plots
        run: |
          test -s ci-results/report.md
          test -s ci-results/summary.csv
          test -s ci-results/figures/conformal_coverage.png
      - name: Save reproducible measurements and plots
        uses: actions/upload-artifact@v4
        with:
          name: shiftscope-results
          path: ci-results/
